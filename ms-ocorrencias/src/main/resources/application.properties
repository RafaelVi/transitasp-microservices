spring.application.name=ms-ocorrencias

# Porta aleatoria: permite subir varias instancias ao mesmo tempo
server.port=0
# Respeita os cabecalhos X-Forwarded-* do gateway (a URI do recurso criado aponta para o gateway)
server.forward-headers-strategy=framework

# MySQL - banco exclusivo deste microsservico (container mysql-ocorrencias do docker-compose.yml)
spring.datasource.url=jdbc:mysql://localhost:3308/db_ocorrencias?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useTimezone=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=transitasp
spring.datasource.password=transitasp

# JPA - quem cria e versiona as tabelas e o Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway - migrations em src/main/resources/db/migration
spring.flyway.enabled=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
# Identificador unico por instancia (necessario com porta aleatoria)
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=20

# Swagger - acesso pelo API Gateway: http://localhost:8082/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# OpenFeign + Circuit Breaker (Resilience4j) + Fallback
# Envolve cada metodo do LinhaClient em um Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# Abre o circuito quando metade das ultimas 10 chamadas falha (minimo de 5 chamadas)
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
# Depois de 10 s aberto, libera 2 chamadas de teste
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
# Um 404 do ms-linhas e resposta valida (linha inexistente), nao conta como falha
resilience4j.circuitbreaker.configs.default.ignore-exceptions[0]=feign.FeignException$NotFound
resilience4j.timelimiter.configs.default.timeout-duration=4s
