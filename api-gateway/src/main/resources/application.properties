spring.application.name=api-gateway
server.port=8082

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=20

# SWAGGER dinamico
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Repassa os cabecalhos X-Forwarded-* aos microsservicos, para que a URI devolvida no POST
# (cabecalho Location) aponte para o gateway e nao para a porta aleatoria da instancia
spring.cloud.gateway.server.webflux.trusted-proxies=.*
